[project]
name = "sheath-pic"
version = "0.2.0"
description = "Axisymmetric RF sheath analysis from measured wafer voltage"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boltzpmp>=0.6.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pyside6>=6.12.0",
    "scipy>=1.18.1",
]

[project.scripts]
sheath-pic = "sheath_pic.__main__:main"

[project.optional-dependencies]
cuda = [
    "cupy-cuda13x>=14.2.0 ; sys_platform != 'darwin'",
    "nvidia-cudss-cu13>=0.8.0.10,<0.9 ; sys_platform != 'darwin'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sheath_pic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --basetemp=.test-tmp"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".uv-cache", ".test-tmp", "artifacts", "results"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
