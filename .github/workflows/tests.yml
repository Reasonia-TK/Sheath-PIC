name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONIOENCODING: utf-8
      QT_QPA_PLATFORM: offscreen
      MPLCONFIGDIR: ${{ github.workspace }}/.mpl-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run --locked python -m ruff check src tests scripts
      - run: uv run --locked python -m ruff format --check src tests scripts
      - run: uv run --locked python -m pytest -q
